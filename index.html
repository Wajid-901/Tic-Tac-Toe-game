<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>
            Tic Tac Toe
            <span class="badge">— minimal • responsive • vs AI</span>
          </h1>
        </div>
        <div class="right-actions">
          <button id="resetScores" class="ghost">Reset Scores</button>
          <button id="newGame" class="accent">New Game</button>
        </div>
      </header>

      <div class="panel top">
        <div class="controls">
          <div class="group" title="Play mode">
            <label>Mode</label>
            <button class="pill active" data-mode="pvp">
              Player vs Player
            </button>
            <button class="pill" data-mode="ai">Player vs Computer</button>
          </div>
          <div class="group" title="Your symbol when playing vs computer">
            <label>You</label>
            <button class="pill active" data-symbol="X">X</button>
            <button class="pill" data-symbol="O">O</button>
          </div>
        </div>
        <div class="status" id="status">Ready. X goes first.</div>
      </div>

      <div class="main">
        <div class="panel">
          <div class="grid" id="grid"></div>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <div class="score">
              <div class="card">
                <div class="label">X Wins</div>
                <div id="scoreX" class="value">0</div>
              </div>
              <div class="card">
                <div class="label">O Wins</div>
                <div id="scoreO" class="value">0</div>
              </div>
              <div class="card">
                <div class="label">Draws</div>
                <div id="scoreD" class="value">0</div>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="footer">
              <div class="hint">
                Tip: In AI mode, choose your symbol first. If you pick
                <strong>O</strong>, the computer (X) moves automatically.
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
